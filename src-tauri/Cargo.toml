[package]
name = "sync-code"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"

[lib]
name = "sync_code_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "sync-code"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
