<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="#0d1117"/>

  <!-- Sync arrows: two curved arcs with arrowheads, teal color -->
  <!-- Top arc: left→right, arrowhead on right end -->
  <path d="M9 14 A8.5 8.5 0 0 1 23 14" stroke="#4dd0e1" stroke-width="2.4"
        fill="none" stroke-linecap="round"/>
  <!-- Arrowhead top-right -->
  <polyline points="20.5,11.5 23.2,14.2 20.5,16.5"
            stroke="#4dd0e1" stroke-width="2.2" fill="none"
            stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Bottom arc: right→left, arrowhead on left end -->
  <path d="M23 18 A8.5 8.5 0 0 1 9 18" stroke="#3fb950" stroke-width="2.4"
        fill="none" stroke-linecap="round"/>
  <!-- Arrowhead bottom-left -->
  <polyline points="11.5,15.5 8.8,18.2 11.5,20.5"
            stroke="#3fb950" stroke-width="2.2" fill="none"
            stroke-linecap="round" stroke-linejoin="round"/>
</svg>
