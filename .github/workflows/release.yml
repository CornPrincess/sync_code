name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-13
            args: '--target universal-apple-darwin'
          - os: ubuntu-22.04
            args: ''
          - os: windows-latest
            args: ''

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Rust (macOS universal)
        if: matrix.os == 'macos-13'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Setup Rust (other platforms)
        if: matrix.os != 'macos-13'
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      # Tauri v2 bundles ALL [[bin]] entries from Cargo.toml automatically.
      # The web-server binary requires --features web and is never compiled by
      # Tauri's own cargo invocation (which only builds the main sync-code bin).
      # We must pre-build it here so the bundler can find it.

      - name: Pre-build web_server binary (Linux / Windows)
        if: matrix.os != 'macos-13'
        run: cargo build --release --features web --bin web_server
        working-directory: src-tauri

      # macOS universal binary: compile for both arches then lipo-merge so the
      # bundler finds web_server under target/universal-apple-darwin/release/.
      - name: Pre-build web_server universal binary (macOS)
        if: matrix.os == 'macos-13'
        run: |
          cargo build --release --features web --bin web_server --target aarch64-apple-darwin
          cargo build --release --features web --bin web_server --target x86_64-apple-darwin
          mkdir -p target/universal-apple-darwin/release
          lipo -create \
            target/aarch64-apple-darwin/release/web_server \
            target/x86_64-apple-darwin/release/web_server \
            -output target/universal-apple-darwin/release/web_server
        working-directory: src-tauri

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name || inputs.tag }}
          releaseName: 'sync_code ${{ github.ref_name || inputs.tag }}'
          releaseBody: |
            ## 下载说明

            | 平台 | 文件 | 说明 |
            |---|---|---|
            | macOS (Apple Silicon + Intel) | `.dmg` | 通用二进制，双架构 |
            | Windows | `.msi` | 推荐安装包（需安装） |
            | Windows | `_x64-setup.exe` | NSIS 安装包（需安装） |
            | Windows | `_portable.zip` | 免安装，解压即用 |
            | Linux | `.deb` | Debian/Ubuntu |
            | Linux | `.AppImage` | 通用 Linux，无需安装 |

            > 首次在 macOS 上运行：右键点击 → 打开（绕过 Gatekeeper）
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Package Windows portable zip
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $version = "${{ github.ref_name || inputs.tag }}"
          $exe = "src-tauri/target/release/sync-code.exe"
          $zipName = "sync-code_${version}_windows_portable.zip"
          Compress-Archive -Path $exe -DestinationPath $zipName
          echo "PORTABLE_ZIP=$zipName" >> $env:GITHUB_ENV

      - name: Upload Windows portable zip to release
        if: matrix.os == 'windows-latest'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name || inputs.tag }}
          files: ${{ env.PORTABLE_ZIP }}
